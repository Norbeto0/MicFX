name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.10.0)'
        required: true
        default: v1.10.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Native RNNoise v0.2, compiled from the official xiph release tarball so
      # the binary is reproducible and auditable. The tarball bundles the model
      # weights (src/rnnoise_data.c); its SHA-256 is pinned so a changed upstream
      # file fails the build instead of silently shipping. gcc here is MinGW-w64
      # from the runner image.
      - name: Build RNNoise from source
        shell: pwsh
        run: |
          $url = 'https://github.com/xiph/rnnoise/releases/download/v0.2/rnnoise-0.2.tar.gz'
          $expected = '90fce4b00b9ff24c08dbfe31b82ffd43bae383d85c5535676d28b0a2b11c0d37'
          Invoke-WebRequest -Uri $url -OutFile rnnoise-0.2.tar.gz
          $actual = (Get-FileHash rnnoise-0.2.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "rnnoise-0.2.tar.gz hash mismatch: $actual" }
          tar -xzf rnnoise-0.2.tar.gz
          # No dot in the directory name: PowerShell splits a native argument
          # like -Irnnoise-0.2/include at the dot, and gcc loses the path.
          Rename-Item rnnoise-0.2 rnnoise-src
          New-Item -ItemType Directory -Force src/MicFX/native | Out-Null
          $src = @('denoise.c','rnn.c','pitch.c','kiss_fft.c','celt_lpc.c','nnet.c','nnet_default.c',
                   'parse_lpcnet_weights.c','rnnoise_data.c','rnnoise_tables.c') |
            ForEach-Object { "rnnoise-src/src/$_" }
          gcc -O3 -shared -static-libgcc '-Irnnoise-src/include' '-Irnnoise-src/src' @src -o src/MicFX/native/rnnoise.dll
          if ($LASTEXITCODE -ne 0) { throw "gcc failed with exit code $LASTEXITCODE" }
          if (!(Test-Path src/MicFX/native/rnnoise.dll)) { throw 'rnnoise build failed' }
          # The DLL is embedded into the assembly, so a dud would only surface at
          # runtime on a user's machine — verify the entry points are exported.
          if (Get-Command objdump -ErrorAction SilentlyContinue) {
            $exports = objdump -p src/MicFX/native/rnnoise.dll | Out-String
            foreach ($fn in 'rnnoise_create', 'rnnoise_destroy', 'rnnoise_process_frame') {
              if ($exports -notmatch $fn) { throw "rnnoise.dll is missing the $fn export" }
            }
          } else {
            Write-Host 'objdump unavailable; skipping export check'
          }
          '{0}: {1} bytes' -f 'rnnoise.dll', (Get-Item src/MicFX/native/rnnoise.dll).Length

      # The suite runs against the DLL just built, and fails if it can't load:
      # this is the only place the Windows native build is exercised before users.
      - name: Test
        shell: pwsh
        env:
          MICFX_REQUIRE_RNNOISE: '1'
        run: dotnet test tests/MicFX.Tests/MicFX.Tests.csproj -c Release

      - name: Verify RNNoise is embedded
        shell: pwsh
        run: |
          $csproj = Get-Content src/MicFX/MicFX.csproj -Raw
          if ($csproj -notmatch 'EmbeddedResource Include="native/rnnoise.dll"') {
            throw 'rnnoise.dll is no longer embedded; it would not ship with the single-file build'
          }

      - name: Publish self-contained exe
        run: >
          dotnet publish src/MicFX/MicFX.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\MicFX.exe -DestinationPath "MicFX-$env:TAG-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\MicFX.iss
          Move-Item installer\Output\MicFX-Setup.exe "MicFX-Setup-$env:TAG.exe"

      # Creates the tag at the built commit if it doesn't exist yet, then the
      # release with the installer, exe and zip attached.
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$env:TAG"
          "MicFX-Setup-$env:TAG.exe"
          "MicFX-$env:TAG-win-x64.zip"
          "publish/MicFX.exe"
          --title "MicFX $env:TAG"
          --notes-file RELEASE_NOTES.md
          --target "$env:GITHUB_SHA"
