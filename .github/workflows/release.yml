name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true
        default: v1.4.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Native RNNoise, compiled from the pinned official xiph source so the
      # binary is reproducible and auditable. gcc here is MinGW-w64 from the
      # runner image.
      - name: Build RNNoise from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.1.1 https://github.com/xiph/rnnoise rnnoise-src
          New-Item -ItemType Directory -Force src/MicFX/native | Out-Null
          $src = @('denoise.c','rnn.c','rnn_data.c','rnn_reader.c','pitch.c','kiss_fft.c','celt_lpc.c') |
            ForEach-Object { "rnnoise-src/src/$_" }
          gcc -O3 -shared -static-libgcc -Irnnoise-src/include -Irnnoise-src/src @src -o src/MicFX/native/rnnoise.dll
          if (!(Test-Path src/MicFX/native/rnnoise.dll)) { throw 'rnnoise build failed' }
          # The DLL is embedded into the assembly, so a dud would only surface at
          # runtime on a user's machine — verify the entry points are exported.
          if (Get-Command objdump -ErrorAction SilentlyContinue) {
            $exports = objdump -p src/MicFX/native/rnnoise.dll | Out-String
            foreach ($fn in 'rnnoise_create', 'rnnoise_destroy', 'rnnoise_process_frame') {
              if ($exports -notmatch $fn) { throw "rnnoise.dll is missing the $fn export" }
            }
          } else {
            Write-Host 'objdump unavailable; skipping export check'
          }
          '{0}: {1} bytes' -f 'rnnoise.dll', (Get-Item src/MicFX/native/rnnoise.dll).Length

      - name: Verify RNNoise is embedded
        shell: pwsh
        run: |
          $csproj = Get-Content src/MicFX/MicFX.csproj -Raw
          if ($csproj -notmatch 'EmbeddedResource Include="native/rnnoise.dll"') {
            throw 'rnnoise.dll is no longer embedded; it would not ship with the single-file build'
          }

      - name: Publish self-contained exe
        run: >
          dotnet publish src/MicFX/MicFX.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\MicFX.exe -DestinationPath "MicFX-$env:TAG-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\MicFX.iss
          Move-Item installer\Output\MicFX-Setup.exe "MicFX-Setup-$env:TAG.exe"

      # Creates the tag at the built commit if it doesn't exist yet, then the
      # release with the installer, exe and zip attached.
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$env:TAG"
          "MicFX-Setup-$env:TAG.exe"
          "MicFX-$env:TAG-win-x64.zip"
          "publish/MicFX.exe"
          --title "MicFX $env:TAG"
          --notes-file RELEASE_NOTES.md
          --target "$env:GITHUB_SHA"
